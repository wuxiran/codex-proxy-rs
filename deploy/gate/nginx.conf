# cpr-gate：CPR 数据面与管理面的固定入口。
#
# 它长期持有 sub2api 使用的网络别名（cpr-green），发版时只改写
# /etc/nginx/cpr/upstream.conf 并 `nginx -s reload`：老 worker 带着在途长流
# 自然结束，新 worker 把新连接转给新槽位。CPR 槽位容器本身不带别名、不发布
# 宿主机端口，因此可以「新的先起、旧的后退」而调用方看不到 connection refused。
#
# 不要给本文件加 worker_shutdown_timeout：那会在 reload 后砍掉仍在跑的 SSE。

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;

    # Docker 内置 DNS。proxy_pass 用变量，槽位容器崩溃重启换 IP 后也能重新解析；
    # 解析不到时单个请求 502，而不是 nginx 起不来。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 由 deploy/rollout.py 原子改写，内容形如：
    #   map "" $cpr_slot { default "codex-proxy-rs-blue-codex-proxy-rs-1:8080"; }
    include /etc/nginx/cpr/upstream.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080;

        client_max_body_size 64m;

        # 入口自身的存活探针，不经过 CPR。
        location = /gate-healthz {
            return 204;
        }

        location / {
            proxy_pass http://$cpr_slot;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_x_real_ip;
            proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # SSE / WebSocket 长流：不缓冲、不提前超时、不自动重放请求。
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_connect_timeout   5s;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
            proxy_next_upstream     off;
        }
    }
}
