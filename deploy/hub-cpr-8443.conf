# 国内访问 cpr.nocannobb.com 的 TLS/SNI 会被中间设备掐断。
# 复用已经能打开的 hub.nocannobb.com，走 Cloudflare 支持的 HTTPS 端口 8443。
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name hub.nocannobb.com;

    ssl_certificate     /etc/nginx/ssl/hub.nocannobb.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hub.nocannobb.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
