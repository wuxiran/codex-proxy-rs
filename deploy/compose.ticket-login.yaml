# 票据登录 sidecar：CPR 用账号的 邮箱/密码/2FA 重新登录换回令牌时调用。
# 只接入 CPR 的内部网络，不映射宿主机端口；镜像由 chatgpt-register 的 Dockerfile.ticket-login 构建。
#   docker compose -f deploy/compose.ticket-login.yaml up -d
# 共享密钥写在 .runtime/ticket-login.env（TICKET_LOGIN_TOKEN=...，0600），
# 并同步到 config.yaml 的 openai.auth.ticket_login.token。
name: cpr-ticket-login

services:
  ticket-login:
    image: ${CPR_TICKET_LOGIN_IMAGE:-cpr-ticket-login:latest}
    container_name: cpr-ticket-login
    pull_policy: never
    restart: unless-stopped
    env_file: ../.runtime/ticket-login.env
    mem_limit: 512m
    cpus: 1.0
    networks: [cpr]

networks:
  cpr:
    external: true
    name: codex-proxy-rs_default
