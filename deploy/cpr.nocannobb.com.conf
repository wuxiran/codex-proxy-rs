server {
    listen 80;
    listen [::]:80;
    server_name cpr.nocannobb.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cpr.nocannobb.com;

    ssl_certificate     /etc/nginx/ssl/hub.nocannobb.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hub.nocannobb.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    # 观澜 CDK SDK：管理端同源调用，不把 CPR Cookie 转给供应商。
    location /guanlan/ {
        proxy_pass https://zzledu.kdns.fr/;
        proxy_ssl_server_name on;
        proxy_ssl_name zzledu.kdns.fr;
        proxy_set_header Host zzledu.kdns.fr;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
